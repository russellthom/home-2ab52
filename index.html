<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#0b1220" />
<link rel="manifest" href="manifest.webmanifest" />
<title>Home</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0b1220;
  --card: #141c2e;
  --card2: #1a2438;
  --line: #243049;
  --text: #e8eefc;
  --muted: #9aa8c3;
  --accent: #5b8cff;
  --on: #3ecf8e;
  --off: #ff6b7a;
  --open: #5b8cff;
  --safe: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
body { min-height: 100dvh; padding: 16px 14px calc(24px + var(--safe)); }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
h1 { font-size: 1.35rem; margin: 0; font-weight: 700; letter-spacing: -0.02em; }
.gear { background: var(--card); border: 1px solid var(--line); color: var(--text);
  border-radius: 12px; width: 42px; height: 42px; font-size: 1.1rem; }
.status { min-height: 1.2em; color: var(--muted); font-size: 0.85rem; margin: 0 0 12px; }
.status.ok { color: var(--on); }
.status.err { color: var(--off); }
.status.busy { color: var(--accent); }
.section { margin: 26px 0 4px; color: var(--text); font-size: 0.9rem; border-bottom: 1px solid var(--line); padding-bottom: 6px; text-transform: uppercase;
  letter-spacing: 0.08em; font-weight: 600; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px; }
.card h2 { margin: 0 0 10px; font-size: 0.95rem; font-weight: 600; }
.manual { display: inline-block; font-size: 0.62rem; font-weight: 700; letter-spacing: 0.06em;
  color: #f0d9a0; background: #2a1f0a; border: 1px solid #5a4318; border-radius: 6px; padding: 1px 5px; margin-left: 6px; vertical-align: middle; }
.subsection { margin: 12px 0 6px; color: var(--muted); font-size: 0.72rem; font-weight: 600; }
.rowlabel { font-size: 0.72rem; color: var(--muted); margin: 8px 0 4px; }
.card .sub { margin: -6px 0 10px; font-size: 0.72rem; color: var(--muted); line-height: 1.3; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
button.action {
  flex: 1; min-width: 64px; border: 0; border-radius: 12px; padding: 12px 8px;
  font-size: 0.9rem; font-weight: 600; color: #061018; cursor: pointer;
}
button.action:active { transform: scale(0.98); }
button.on { background: var(--on); }
button.off { background: var(--off); color: #fff; }
button.open { background: var(--open); color: #fff; }
button.close { background: #7b879e; color: #fff; }
button.speed { background: #8a7bff; color: #fff; min-width: 0; padding: 10px 4px; font-size: 0.82rem; }
.row.speeds { gap: 6px; flex-wrap: nowrap; }
.grid > * { min-width: 0; }
#ceiling-fans { grid-template-columns: 1fr; }
#setup { display: none; background: var(--card2); border: 1px solid var(--line); border-radius: 16px;
  padding: 14px; margin-bottom: 14px; }
#setup.show { display: block; }
#setup label { display: block; font-size: 0.8rem; color: var(--muted); margin: 8px 0 4px; }
#setup input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg); color: var(--text); font-size: 1rem; }
#setup .hint { font-size: 0.78rem; color: var(--muted); margin-top: 8px; line-height: 1.35; }
#setup .save { margin-top: 12px; width: 100%; background: var(--accent); color: #fff;
  border: 0; border-radius: 12px; padding: 12px; font-weight: 600; }
.banner { background: #2a1f0a; border: 1px solid #5a4318; color: #f0d9a0; border-radius: 12px;
  padding: 10px 12px; font-size: 0.85rem; margin-bottom: 12px; display: none; }
.banner.show { display: block; }
</style>
</head>
<body>
<header>
  <h1>Home</h1>
  <button class="gear" id="gearBtn" type="button" aria-label="Settings">⚙</button>
</header>
<div class="banner" id="setupBanner">Paste your webhook URL and key in settings (once), then Share → Add to Home Screen.</div>
<p class="status" id="status"></p>
<div id="setup">
  <strong>Webhook</strong>
  <label for="webhookUrl">URL</label>
  <input id="webhookUrl" type="url" autocomplete="off" spellcheck="false" placeholder="https://…" />
  <label for="webhookKey">Key</label>
  <input id="webhookKey" type="password" autocomplete="off" spellcheck="false" placeholder="paste key" />
  <button class="save" id="saveBtn" type="button">Save</button>
  <p class="hint">CEO → Home dashboard webhook routine → copy Webhook URL and key. This panel sends lights / shades / blinds / curtains commands, plus manual per-fan ceiling fan buttons.</p>
</div>
<div id="app"></div>
<script>
const LS_URL = "homeDash.webhookUrl";
const LS_KEY = "homeDash.webhookKey";
const statusEl = document.getElementById("status");
const setupEl = document.getElementById("setup");
const banner = document.getElementById("setupBanner");

function cfg() {
  return {
    url: localStorage.getItem(LS_URL) || "",
    key: localStorage.getItem(LS_KEY) || "",
  };
}
function refreshSetupUi() {
  const c = cfg();
  document.getElementById("webhookUrl").value = c.url;
  document.getElementById("webhookKey").value = c.key;
  const missing = !c.url || !c.key;
  banner.classList.toggle("show", missing);
  if (missing) setupEl.classList.add("show");
}
function setStatus(msg, kind) {
  statusEl.textContent = msg || "";
  statusEl.className = "status" + (kind ? " " + kind : "");
}

async function send(command, label) {
  const c = cfg();
  if (!c.url || !c.key) {
    setupEl.classList.add("show");
    setStatus("Add webhook URL and key in settings first.", "err");
    return;
  }
  setStatus((label || command) + "…", "busy");
  const rawKey = c.key.replace(/^Bearer\s+/i, "").trim();
  const headers = {
    "Content-Type": "application/json",
    "Authorization": "Bearer " + rawKey,
    "X-Webhook-Key": rawKey,
  };
  try {
    const res = await fetch(c.url, {
      method: "POST",
      headers,
      body: JSON.stringify({ command, label: label || command }),
      mode: "cors",
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    setStatus((label || command) + " sent", "ok");
  } catch (e) {
    setStatus("Failed: " + (e && e.message ? e.message : e), "err");
  }
}

function btn(text, cls, command, label) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "action " + cls;
  b.textContent = text;
  b.addEventListener("click", () => send(command, label));
  return b;
}

function card(title, sub, tag) {
  const c = document.createElement("div");
  c.className = "card";
  const h = document.createElement("h2");
  h.textContent = title;
  if (tag) {
    const t = document.createElement("span");
    t.className = "manual";
    t.textContent = tag;
    h.appendChild(t);
  }
  c.appendChild(h);
  if (sub) {
    const s = document.createElement("div");
    s.className = "sub";
    s.textContent = sub;
    c.appendChild(s);
  }
  return c;
}
function row(...buttons) {
  const r = document.createElement("div");
  r.className = "row";
  for (const b of buttons) r.appendChild(b);
  return r;
}
function lightsLabel(name) {
  return /lights?$/i.test(name) ? name : name + " lights";
}
function section(app, title, cls) {
  const s = document.createElement("div");
  s.className = "section " + (cls || "");
  s.textContent = title;
  app.appendChild(s);
}
function subsection(app, title) {
  const s = document.createElement("div");
  s.className = "subsection";
  s.textContent = title;
  app.appendChild(s);
}
function grid(app, id) {
  const g = document.createElement("div");
  g.className = "grid";
  if (id) g.id = id;
  app.appendChild(g);
  return g;
}

// LIGHTS: lights-only commands (room/all groups never include fans).
function roomLightsCard(room) {
  const name = lightsLabel(room.label);
  const c = card(name);
  const lightTarget = room.targetLights || room.label;
  c.appendChild(row(
    btn("On", "on", "turn on " + lightTarget + " lights", name + " on"),
    btn("Off", "off", "turn off " + lightTarget + " lights", name + " off")));
  return c;
}
// BLINDS / CURTAINS: open/close only, target = room-map alias.
function coverCard(g) {
  const c = card(g.label, g.devices);
  const openCmd = g.openCommand || ("open " + g.target);
  const closeCmd = g.closeCommand || ("close " + g.target);
  c.appendChild(row(
    btn("Open", "open", openCmd, g.label + " open"),
    btn("Close", "close", closeCmd, g.label + " close")));
  return c;
}
// FANS: MANUAL, one card per fan; acts on that single fan only. Never in any group/room/all/scene.
function fanCard(f) {
  const c = card(f.label, "Fan only · " + f.device, "MANUAL");
  c.appendChild(row(
    btn("On", "on", f.fanOn, f.label + " on"),
    btn("Off", "off", f.fanOff, f.label + " off")));
  if (Array.isArray(f.speeds) && f.speeds.length && f.speedCommand) {
    const sl = document.createElement("div");
    sl.className = "rowlabel";
    sl.textContent = "Fan speed";
    c.appendChild(sl);
    const sr = row(...f.speeds.map((n) =>
      btn(n + "%", "speed", f.speedCommand.replace("{N}", n), f.label + " speed " + n + "%")));
    sr.classList.add("speeds");
    c.appendChild(sr);
  }
  return c;
}
// Fan's light (lights only), shown under Lights.
function fanLightCard(f) {
  const c = card(f.lightLabel || (f.label + " light"), "Light only · " + f.lightDevice);
  c.appendChild(row(
    btn("On", "on", f.lightOn, (f.lightLabel || f.label + " light") + " on"),
    btn("Off", "off", f.lightOff, (f.lightLabel || f.label + " light") + " off")));
  return c;
}

async function render() {
  const data = await fetch("rooms.json", { cache: "no-store" }).then((r) => r.json());
  const app = document.getElementById("app");
  app.innerHTML = "";

  // ---- Lights ----
  section(app, "💡 Lights", "lights");
  subsection(app, "Whole house, floors & favorites");
  const qg = grid(app, "lights-quick");
  for (const q of data.quick) {
    const c = card(q.label);
    c.appendChild(row(
      btn("On", "on", "turn on " + q.target, q.label + " on"),
      btn("Off", "off", "turn off " + q.target, q.label + " off")));
    qg.appendChild(c);
  }
  for (const floor of data.floors) {
    const rooms = floor.rooms.filter((r) => r.lights);
    if (!rooms.length) continue;
    subsection(app, floor.label);
    const g = grid(app);
    for (const room of rooms) g.appendChild(roomLightsCard(room));
  }
  const fans = Array.isArray(data.ceilingFans) ? data.ceilingFans : [];
  const fanLights = fans.filter((f) => f.lightOn && f.lightOff);
  if (fanLights.length) {
    subsection(app, "Ceiling fan lights");
    const g = grid(app, "fan-lights");
    for (const f of fanLights) g.appendChild(fanLightCard(f));
  }

  // ---- Blinds / Curtains ----
  const covers = Array.isArray(data.covers) ? data.covers : [];
  const blinds = covers.filter((c) => (c.type || "blinds") === "blinds");
  const curtains = covers.filter((c) => c.type === "curtains");
  if (blinds.length) {
    section(app, "🪟 Blinds", "blinds");
    const g = grid(app, "blinds");
    for (const c of blinds) g.appendChild(coverCard(c));
  }
  if (curtains.length) {
    section(app, "🎭 Curtains", "curtains");
    const g = grid(app, "curtains");
    for (const c of curtains) g.appendChild(coverCard(c));
  }

  // ---- Fans ----
  if (fans.length) {
    section(app, "🌀 Fans", "fans");
    const g = grid(app, "ceiling-fans");
    for (const f of fans) g.appendChild(fanCard(f));
  }
}

document.getElementById("gearBtn").addEventListener("click", () => {
  setupEl.classList.toggle("show");
});
document.getElementById("saveBtn").addEventListener("click", () => {
  localStorage.setItem(LS_URL, document.getElementById("webhookUrl").value.trim());
  localStorage.setItem(LS_KEY, document.getElementById("webhookKey").value.trim());
  refreshSetupUi();
  setStatus("Saved on this device.", "ok");
});
refreshSetupUi();
render().catch((e) => setStatus("Could not load rooms: " + e, "err"));
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js?v=5").catch(() => {});
}
</script>
</body>
</html>
