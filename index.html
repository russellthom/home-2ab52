<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#0b1220" />
<link rel="manifest" href="manifest.webmanifest" />
<title>Home</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0b1220;
  --card: #141c2e;
  --card2: #1a2438;
  --line: #243049;
  --text: #e8eefc;
  --muted: #9aa8c3;
  --accent: #5b8cff;
  --on: #3ecf8e;
  --off: #ff6b7a;
  --open: #5b8cff;
  --safe: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
body { min-height: 100dvh; padding: 16px 14px calc(24px + var(--safe)); }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
h1 { font-size: 1.35rem; margin: 0; font-weight: 700; letter-spacing: -0.02em; }
.gear { background: var(--card); border: 1px solid var(--line); color: var(--text);
  border-radius: 12px; width: 42px; height: 42px; font-size: 1.1rem; }
.status { min-height: 1.2em; color: var(--muted); font-size: 0.85rem; margin: 0 0 12px; }
.status.ok { color: var(--on); }
.status.err { color: var(--off); }
.status.busy { color: var(--accent); }
.section { margin: 18px 0 8px; color: var(--muted); font-size: 0.75rem; text-transform: uppercase;
  letter-spacing: 0.08em; font-weight: 600; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px; }
.card h2 { margin: 0 0 10px; font-size: 0.95rem; font-weight: 600; }
.manual { display: inline-block; font-size: 0.62rem; font-weight: 700; letter-spacing: 0.06em;
  color: #f0d9a0; background: #2a1f0a; border: 1px solid #5a4318; border-radius: 6px; padding: 1px 5px; margin-left: 6px; vertical-align: middle; }
.rowlabel { font-size: 0.72rem; color: var(--muted); margin: 8px 0 4px; }
.card .sub { margin: -6px 0 10px; font-size: 0.72rem; color: var(--muted); line-height: 1.3; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
button.action {
  flex: 1; min-width: 64px; border: 0; border-radius: 12px; padding: 12px 8px;
  font-size: 0.9rem; font-weight: 600; color: #061018; cursor: pointer;
}
button.action:active { transform: scale(0.98); }
button.on { background: var(--on); }
button.off { background: var(--off); color: #fff; }
button.open { background: var(--open); color: #fff; }
button.close { background: #7b879e; color: #fff; }
#setup { display: none; background: var(--card2); border: 1px solid var(--line); border-radius: 16px;
  padding: 14px; margin-bottom: 14px; }
#setup.show { display: block; }
#setup label { display: block; font-size: 0.8rem; color: var(--muted); margin: 8px 0 4px; }
#setup input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg); color: var(--text); font-size: 1rem; }
#setup .hint { font-size: 0.78rem; color: var(--muted); margin-top: 8px; line-height: 1.35; }
#setup .save { margin-top: 12px; width: 100%; background: var(--accent); color: #fff;
  border: 0; border-radius: 12px; padding: 12px; font-weight: 600; }
.banner { background: #2a1f0a; border: 1px solid #5a4318; color: #f0d9a0; border-radius: 12px;
  padding: 10px 12px; font-size: 0.85rem; margin-bottom: 12px; display: none; }
.banner.show { display: block; }
</style>
</head>
<body>
<header>
  <h1>Home</h1>
  <button class="gear" id="gearBtn" type="button" aria-label="Settings">⚙</button>
</header>
<div class="banner" id="setupBanner">Paste your webhook URL and key in settings (once), then Share → Add to Home Screen.</div>
<p class="status" id="status"></p>
<div id="setup">
  <strong>Webhook</strong>
  <label for="webhookUrl">URL</label>
  <input id="webhookUrl" type="url" autocomplete="off" spellcheck="false" placeholder="https://…" />
  <label for="webhookKey">Key</label>
  <input id="webhookKey" type="password" autocomplete="off" spellcheck="false" placeholder="paste key" />
  <button class="save" id="saveBtn" type="button">Save</button>
  <p class="hint">CEO → Home dashboard webhook routine → copy Webhook URL and key. This panel sends lights / shades / blinds / curtains commands, plus manual per-fan ceiling fan buttons.</p>
</div>
<div id="app"></div>
<script>
const LS_URL = "homeDash.webhookUrl";
const LS_KEY = "homeDash.webhookKey";
const statusEl = document.getElementById("status");
const setupEl = document.getElementById("setup");
const banner = document.getElementById("setupBanner");

function cfg() {
  return {
    url: localStorage.getItem(LS_URL) || "",
    key: localStorage.getItem(LS_KEY) || "",
  };
}
function refreshSetupUi() {
  const c = cfg();
  document.getElementById("webhookUrl").value = c.url;
  document.getElementById("webhookKey").value = c.key;
  const missing = !c.url || !c.key;
  banner.classList.toggle("show", missing);
  if (missing) setupEl.classList.add("show");
}
function setStatus(msg, kind) {
  statusEl.textContent = msg || "";
  statusEl.className = "status" + (kind ? " " + kind : "");
}

async function send(command, label) {
  const c = cfg();
  if (!c.url || !c.key) {
    setupEl.classList.add("show");
    setStatus("Add webhook URL and key in settings first.", "err");
    return;
  }
  setStatus((label || command) + "…", "busy");
  const rawKey = c.key.replace(/^Bearer\s+/i, "").trim();
  const headers = {
    "Content-Type": "application/json",
    "Authorization": "Bearer " + rawKey,
    "X-Webhook-Key": rawKey,
  };
  try {
    const res = await fetch(c.url, {
      method: "POST",
      headers,
      body: JSON.stringify({ command, label: label || command }),
      mode: "cors",
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    setStatus((label || command) + " sent", "ok");
  } catch (e) {
    setStatus("Failed: " + (e && e.message ? e.message : e), "err");
  }
}

function btn(text, cls, command, label) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "action " + cls;
  b.textContent = text;
  b.addEventListener("click", () => send(command, label));
  return b;
}

function roomCard(room) {
  const card = document.createElement("div");
  card.className = "card";
  const h = document.createElement("h2");
  h.textContent = room.label;
  card.appendChild(h);
  const row = document.createElement("div");
  row.className = "row";
  const lightTarget = room.targetLights || room.label;
  if (room.lights) {
    row.appendChild(btn("On", "on", "turn on " + lightTarget + " lights", room.label + " lights on"));
    row.appendChild(btn("Off", "off", "turn off " + lightTarget + " lights", room.label + " lights off"));
  }
  if (room.blinds) {
    if (room.blindMode === "scenes") {
      row.appendChild(btn("Open", "open", "run " + room.blindOpen, room.label + " blinds open"));
      row.appendChild(btn("Close", "close", "run " + room.blindClose, room.label + " blinds close"));
    } else {
      const openCmd = room.blindOpenCommand || ("open " + room.label + " blinds");
      const closeCmd = room.blindCloseCommand || ("close " + room.label + " blinds");
      row.appendChild(btn("Open", "open", openCmd, room.label + " blinds open"));
      row.appendChild(btn("Close", "close", closeCmd, room.label + " blinds close"));
    }
  }
  card.appendChild(row);
  return card;
}

// Blinds & Curtains groups: open/close only (never on/off), target = room-map alias.
function coverCard(g) {
  const card = document.createElement("div");
  card.className = "card";
  const h = document.createElement("h2");
  h.textContent = g.label;
  card.appendChild(h);
  if (g.devices) {
    const sub = document.createElement("div");
    sub.className = "sub";
    sub.textContent = g.devices;
    card.appendChild(sub);
  }
  const row = document.createElement("div");
  row.className = "row";
  const openCmd = g.openCommand || ("open " + g.target);
  const closeCmd = g.closeCommand || ("close " + g.target);
  row.appendChild(btn("Open", "open", openCmd, g.label + " open"));
  row.appendChild(btn("Close", "close", closeCmd, g.label + " close"));
  card.appendChild(row);
  return card;
}

// Ceiling fans: MANUAL, one card per fan. Fan buttons act on that single fan only;
// fans are never part of any group / room / all / scene button. Light buttons = that fan's light only.
function fanCard(f) {
  const card = document.createElement("div");
  card.className = "card";
  const h = document.createElement("h2");
  h.textContent = f.label;
  const tag = document.createElement("span");
  tag.className = "manual";
  tag.textContent = "MANUAL";
  h.appendChild(tag);
  card.appendChild(h);
  const fl = document.createElement("div");
  fl.className = "rowlabel";
  fl.textContent = "Fan · " + f.device;
  card.appendChild(fl);
  const frow = document.createElement("div");
  frow.className = "row";
  frow.appendChild(btn("On", "on", f.fanOn, f.label + " on"));
  frow.appendChild(btn("Off", "off", f.fanOff, f.label + " off"));
  card.appendChild(frow);
  if (f.lightOn && f.lightOff) {
    const ll = document.createElement("div");
    ll.className = "rowlabel";
    ll.textContent = "Light · " + f.lightDevice;
    card.appendChild(ll);
    const lrow = document.createElement("div");
    lrow.className = "row";
    lrow.appendChild(btn("On", "on", f.lightOn, f.label + " light on"));
    lrow.appendChild(btn("Off", "off", f.lightOff, f.label + " light off"));
    card.appendChild(lrow);
  }
  return card;
}

async function render() {
  const data = await fetch("rooms.json", { cache: "no-store" }).then((r) => r.json());
  const app = document.getElementById("app");
  app.innerHTML = "";

  const qs = document.createElement("div");
  qs.className = "section";
  qs.textContent = "Quick";
  app.appendChild(qs);
  const qgrid = document.createElement("div");
  qgrid.className = "grid";
  for (const q of data.quick) {
    const card = document.createElement("div");
    card.className = "card";
    const h = document.createElement("h2");
    h.textContent = q.label;
    card.appendChild(h);
    const row = document.createElement("div");
    row.className = "row";
    row.appendChild(btn("On", "on", "turn on " + q.target, q.label + " on"));
    row.appendChild(btn("Off", "off", "turn off " + q.target, q.label + " off"));
    card.appendChild(row);
    qgrid.appendChild(card);
  }
  app.appendChild(qgrid);

  if (Array.isArray(data.covers) && data.covers.length) {
    const cs = document.createElement("div");
    cs.className = "section";
    cs.textContent = "Blinds & Curtains";
    app.appendChild(cs);
    const cgrid = document.createElement("div");
    cgrid.className = "grid";
    cgrid.id = "covers";
    for (const g of data.covers) cgrid.appendChild(coverCard(g));
    app.appendChild(cgrid);
  }

  if (Array.isArray(data.ceilingFans) && data.ceilingFans.length) {
    const fs = document.createElement("div");
    fs.className = "section";
    fs.textContent = "Ceiling fans";
    app.appendChild(fs);
    const fgrid = document.createElement("div");
    fgrid.className = "grid";
    fgrid.id = "ceiling-fans";
    for (const f of data.ceilingFans) fgrid.appendChild(fanCard(f));
    app.appendChild(fgrid);
  }

  for (const floor of data.floors) {
    const s = document.createElement("div");
    s.className = "section";
    s.textContent = floor.label;
    app.appendChild(s);
    const grid = document.createElement("div");
    grid.className = "grid";
    for (const room of floor.rooms) grid.appendChild(roomCard(room));
    app.appendChild(grid);
  }
}

document.getElementById("gearBtn").addEventListener("click", () => {
  setupEl.classList.toggle("show");
});
document.getElementById("saveBtn").addEventListener("click", () => {
  localStorage.setItem(LS_URL, document.getElementById("webhookUrl").value.trim());
  localStorage.setItem(LS_KEY, document.getElementById("webhookKey").value.trim());
  refreshSetupUi();
  setStatus("Saved on this device.", "ok");
});
refreshSetupUi();
render().catch((e) => setStatus("Could not load rooms: " + e, "err"));
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js?v=3").catch(() => {});
}
</script>
</body>
</html>
